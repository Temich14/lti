gin:
  - name: lti-core
    port: 8080
    enabled: true
    sw:
      enabled: true
    docs:
      enabled: true
    prom:
      enabled: true
    middleware:
      logging:
        enabled: true
      prom:
        enabled: true
      meta:
        enabled: true
app:
  database:
    host: localhost
    port: 5432
    user: postgres
    password: postgres
    dbname: lti
    max_conns: 10
    min_conns: 2
    sslmode: disable
  redis:
    addr: "localhost:6379"
    password: ""
    db: 0
    ttl: "3600s"
    session_key: "lti:session"
    max_size: 10
  lti:
    tool_name: dive
    domain: "172.17.16.1"
    registration_client_uri: "http://172.17.16.1:8080/lti/auth/register"
    login_client_uri: "http://172.17.16.1:8080/lti/auth/login"
    application_type: web
  oauth:
    private_key_path: private.pem
    key_id: tool-key-1
    redirect_uri: "http://172.17.16.1:8080/lti/launch"
    jwks_uri: "http://172.17.16.1:8080/lti/.well-known/jwks.json"
    scopes:
      - openid
      - profile