services:

  redis:
    image: redis:8.2-alpine
    container_name: lti_redis
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    restart: always

  moodle_db:
    image: mariadb:10.2
    volumes:
      - 'moodledb_maria_apache:/var/lib/mysql'
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_ONETIME_PASSWORD: "yes"
      MYSQL_DATABASE: "moodle_db"
      MYSQL_USER: "moodle_user"
      MYSQL_PASSWORD: "moodle_password"

  moodle:
    image: ellakcy/moodle:mysql_maria_apache_latest
    volumes:
      - './data/moodle:/var/moodledata:rw'
      - 'www_maria_apache:/var/www/html:rw'
    ports:
      - '8082:80'
    links:
      - moodle_db
    environment:
      MOODLE_URL: "http://localhost:8082"
      MOODLE_ADMIN: "admin"
      MOODLE_ADMIN_PASSWORD: "admin123"
      MOODLE_ADMIN_EMAIL: "admin@example.com"
      MOODLE_DB_TYPE: "mariadb"
      MOODLE_DB_HOST: "moodle_db"
      MOODLE_DB_USER: "moodle_user"
      MOODLE_DB_PASSWORD: "moodle_password"
      MOODLE_DB_NAME: "moodle_db"
      MOODLE_REVERSE_LB: "false"
      MOODLE_SSL: "false"
      MOODLE_EMAIL_TYPE_QMAIL: "false"
      MOODLE_EMAIL_HOST: ""

volumes:
  moodledb_maria_apache:
  www_maria_apache: