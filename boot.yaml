gin:
  - name: lti-core
    port: 8080
    enabled: true
    sw:
      enabled: true
    docs:
      enabled: true
    prom:
      enabled: true
    middleware:
      logging:
        enabled: true
      prom:
        enabled: true
      meta:
        enabled: true
app:
  database:
    host: localhost
    port: 5432
    user: postgres
    password: postgres
    dbname: lti
    max_conns: 10
    min_conns: 2
    sslmode: disable
  redis:
    addr: "localhost:6379"
    password: ""
    db: 0
    ttl: "3600s"
    session_key: "lti:session"
    max_size: 10
  lti:
    tool_name: dive
    domain: "172.17.16.1"
    registration_client_uri: "http://172.17.16.1:8080/lti/auth/register"
    login_client_uri: "http://172.17.16.1:8080/lti/auth/login"
    application_type: web
  oauth:
    private_key_path: private.pem
    key_id: tool-key-1
    redirect_uri: "http://172.17.16.1:8080/lti/launch"
    jwks_uri: "http://172.17.16.1:8080/lti/.well-known/jwks.json"
    scopes:
      - openid
      - profile

kafka:
  enabled: false
  brokers:
    - "localhost:9092"
  topic: "users.synchronization.v1"
  group_id: "lti-core.users-sync"
  client_id: "lti-core"
  min_bytes: 1
  max_bytes: 10485760

enrollment_sync:
  batch_size: 100
  outbox_batch_size: 200
  outbox_poll_interval: "1s"
  outbox_lock_lease: "30s"
  outbox_max_attempts: 20
  roster_worker_poll_interval: "2s"
  roster_lock_lease: "1m"
  consumer_enabled: false
  consumer_concurrency: 1
  consumer_read_batch_size: 1