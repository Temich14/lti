version: "2"
sql:
  - schema: "internal/infrastructure/db/schema.sql"
    queries: "internal/infrastructure/db/query/platform.sql"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "internal/infrastructure/db"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"